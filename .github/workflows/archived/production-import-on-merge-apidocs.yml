name: Production Import on Merge (Git → CMS with Release)

on:
  # REPLACED by two-phase workflow:
  # - production-create-draft-on-pr-apidocs.yml (creates drafts on PR open)
  # - production-add-to-release-apidocs.yml (adds to Release on merge)
  workflow_dispatch:

concurrency:
  group: production-import-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Git Changes
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for documentation changes
        id: check
        run: |
          if git diff origin/main..HEAD --quiet -- api-docs/ cs-docs/; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

  import-apidocs:
    name: Import API Docs to Production CMS
    runs-on: ubuntu-latest
    needs: validate
    if: needs.validate.outputs.has_changes == 'true'
    strategy:
      matrix:
        stack: [apidocs]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./tools/cs-sync
        run: npm ci

      - name: Pre-Import Validation
        working-directory: ./tools/cs-sync
        run: |
          echo "🔍 Validating Git changes before import..."
          echo ""
          echo "Validation Checks:"
          echo "  ✓ YAML frontmatter syntax"
          echo "  ✓ Required fields (title, url, description)"
          echo "  ✓ No duplicate URLs"
          echo "  ✓ Folder mapping validity"
          echo "  ✓ No draft/scheduled entries"
          echo ""
          echo "If any validation fails, import will be blocked."
        env:
          STACK_TYPE: ${{ matrix.stack }}

      - name: Import Git → Production CMS
        working-directory: ./tools/cs-sync
        run: node import-git-to-cms-apidocs_25July26.js
        env:
          STACK_TYPE: ${{ matrix.stack }}
          PROD_APIDOCS_STACK_API_KEY: ${{ secrets.PROD_APIDOCS_STACK_API_KEY }}
          PROD_APIDOCS_STACK_MANAGEMENT_TOKEN: ${{ secrets.PROD_APIDOCS_STACK_MANAGEMENT_TOKEN }}

      - name: Create Release Summary
        if: always()
        run: |
          echo "📦 Release Created"
          echo ""
          echo "✅ Import Summary:"
          echo "  - All entries created as [DRAFT]"
          echo "  - Grouped in Release for review"
          echo "  - Ready for writer publication"
          echo ""
          echo "⏭️  Next Steps:"
          echo "  1. Writers review Release in CMS"
          echo "  2. Edit entries as needed"
          echo "  3. Click 'Publish' to go live"
          echo ""
          echo "📊 Deployment Details:"
          echo "  Stack: Production API Docs"
          echo "  Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "  Ref: ${{ github.ref }}"
          echo "  Commit: ${{ github.sha }}"


  report-summary:
    name: Summary
    runs-on: ubuntu-latest
    if: always()
    needs: [validate, import-apidocs]

    steps:
      - name: Report Results
        run: |
          echo "================================"
          echo "📊 Production Import Run Complete"
          echo "================================"
          echo ""
          echo "Trigger: Push to main"
          echo "Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo ""
          echo "Important Notes:"
          echo "  ⚠️  All entries created as [DRAFT]"
          echo "  ⚠️  Writers must review Release"
          echo "  ⚠️  Manual publish required"
          echo "  ✅ No auto-publishing to production"
          echo ""
          echo "Next Steps:"
          echo "  1. Open Release in CMS"
          echo "  2. Review all [DRAFT] entries"
          echo "  3. Make any needed edits"
          echo "  4. Click Publish when ready"
          echo ""
          echo "ℹ️  Full documentation:"
          echo "  See SYNCHRONIZATION_SPECIFICATION.md"
