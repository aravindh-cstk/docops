name: Sandbox Test (Safe - No Production)

on:
  workflow_dispatch:

jobs:
  sandbox-test:
    runs-on: ubuntu-latest
    name: Test Sandbox ↔ Git Sync

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./tools/cs-sync
        run: npm ci

      - name: Run Sandbox Test (Git ↔ Sandbox only)
        working-directory: ./tools/cs-sync
        run: node sandbox-test-sync.js
        env:
          PROD_APIDOCS_STACK_API_KEY: ${{ secrets.PROD_APIDOCS_STACK_API_KEY }}
          PROD_APIDOCS_STACK_DELIVERY_TOKEN: ${{ secrets.PROD_APIDOCS_STACK_DELIVERY_TOKEN }}
          APIDOCS_SANDBOX_STACK_API_KEY: ${{ secrets.APIDOCS_SANDBOX_STACK_API_KEY }}
          APIDOCS_SANDBOX_MANAGEMENT_TOKEN: ${{ secrets.APIDOCS_SANDBOX_MANAGEMENT_TOKEN }}

      - name: Report Results
        if: success()
        run: echo "✅ Sandbox test completed successfully"

      - name: Report Failure
        if: failure()
        run: echo "❌ Sandbox test failed - check logs above"
