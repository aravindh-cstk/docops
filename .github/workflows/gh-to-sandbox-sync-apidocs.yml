name: Sync GitHub to Sandbox (API Docs)

on:
  push:
    branches:
      - main
    paths:
      - 'api-docs/**'
      - '.github/workflows/gh-to-sandbox-sync-apidocs.yml'

permissions:
  contents: read

jobs:
  sync-to-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tools/cs-sync/package-lock.json

      - name: Install dependencies
        working-directory: tools/cs-sync
        run: npm ci

      - name: Sync API Docs from Git to Sandbox
        working-directory: tools/cs-sync
        env:
          APIDOCS_SANDBOX_STACK_API_KEY: ${{ secrets.APIDOCS_SANDBOX_STACK_API_KEY }}
          APIDOCS_SANDBOX_MANAGEMENT_TOKEN: ${{ secrets.APIDOCS_SANDBOX_MANAGEMENT_TOKEN }}
        run: |
          cat > sync-to-sandbox.js << 'EOF'
          const https = require('https');
          const fs = require('fs');
          const path = require('path');

          function request(method, host, path, headers = {}, body = null) {
            return new Promise((resolve, reject) => {
              const opts = { hostname: host, path, method, headers };
              const req = https.request(opts, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  try {
                    const json = JSON.parse(data || '{}');
                    resolve({ status: res.statusCode, data: json });
                  } catch (e) {
                    resolve({ status: res.statusCode, data });
                  }
                });
              });
              req.on('error', reject);
              if (body) req.write(JSON.stringify(body));
              req.end();
            });
          }

          function parseFrontmatter(content) {
            const match = content.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
            if (!match) return { frontmatter: {}, body: content };
            const frontmatterText = match[1];
            const body = match[2];
            const frontmatter = {};
            frontmatterText.split('\n').forEach(line => {
              const [key, ...valueParts] = line.split(':');
              if (key && valueParts.length > 0) {
                const value = valueParts.join(':').trim().replace(/^["']|["']$/g, '');
                frontmatter[key.trim()] = value;
              }
            });
            return { frontmatter, body };
          }

          async function main() {
            const apiKey = process.env.APIDOCS_SANDBOX_STACK_API_KEY;
            const token = process.env.APIDOCS_SANDBOX_MANAGEMENT_TOKEN;

            if (!apiKey || !token) {
              console.error('❌ Missing Sandbox credentials');
              process.exit(1);
            }

            console.log('🔄 Syncing API Docs from Git to Sandbox\n');

            const apiDocsPath = path.join(__dirname, '../../api-docs');
            if (!fs.existsSync(apiDocsPath)) {
              console.log('⚠️  api-docs directory not found');
              return;
            }

            const files = [];
            const walk = (dir, relativePath = '') => {
              const entries = fs.readdirSync(dir, { withFileTypes: true });
              entries.forEach(entry => {
                const fullPath = path.join(dir, entry.name);
                const relPath = path.join(relativePath, entry.name);
                if (entry.isDirectory()) {
                  walk(fullPath, relPath);
                } else if (entry.name.endsWith('.md')) {
                  files.push({
                    filePath: fullPath,
                    relativePath: relPath,
                    folder: path.dirname(relPath),
                    fileName: entry.name,
                  });
                }
              });
            };
            walk(apiDocsPath);

            console.log(`📝 Found ${files.length} markdown files\n`);

            let synced = 0;
            let skipped = 0;
            let failed = 0;

            for (const file of files) {
              try {
                const content = fs.readFileSync(file.filePath, 'utf-8');
                const { frontmatter, body } = parseFrontmatter(content);

                const folderName = path.basename(file.folder);
                const contentTypeMap = {
                  'api-detail': 'api_detail_page',
                  'cma-api-requests': 'api_requests_cma',
                  'cda-api-requests': 'api_requests_cda',
                  'graphql-api-requests': 'api_requests_graphql',
                };
                const contentTypeUid = contentTypeMap[folderName];

                if (!contentTypeUid) {
                  console.log(`  ⚠️  Skipping ${file.fileName}: unknown content type for folder ${folderName}`);
                  skipped++;
                  continue;
                }

                const entryData = {
                  title: frontmatter.title || 'Untitled',
                  url: frontmatter.url || frontmatter.title?.toLowerCase().replace(/\s+/g, '-'),
                  body: body.trim(),
                  ...Object.entries(frontmatter).reduce((acc, [k, v]) => {
                    if (!['title', 'url', 'product', 'doc_type', 'audience', 'version', 'last_updated'].includes(k)) {
                      acc[k] = v;
                    }
                    return acc;
                  }, {}),
                };

                // Check if entry exists
                const queryPath = `/v3/content_types/${contentTypeUid}/entries?query={"url":"${entryData.url}"}`;
                const existRes = await request('GET', 'api.contentstack.io', queryPath, {
                  'api_key': apiKey,
                  'authorization': token,
                });

                if (existRes.status !== 200) {
                  console.log(`  ❌ ${file.fileName}: Failed to check existing entry`);
                  failed++;
                  continue;
                }

                const existing = existRes.data.entries?.[0];

                if (existing) {
                  // Update existing
                  const updatePath = `/v3/content_types/${contentTypeUid}/entries/${existing.uid}`;
                  const updateRes = await request('PUT', 'api.contentstack.io', updatePath, {
                    'api_key': apiKey,
                    'authorization': token,
                  }, { entry: entryData });

                  if (updateRes.status === 200) {
                    console.log(`  ✓ Updated: ${entryData.title}`);
                    synced++;
                  } else {
                    console.log(`  ❌ ${file.fileName}: Update failed`);
                    failed++;
                  }
                } else {
                  // Create new
                  const createPath = `/v3/content_types/${contentTypeUid}/entries`;
                  const createRes = await request('POST', 'api.contentstack.io', createPath, {
                    'api_key': apiKey,
                    'authorization': token,
                  }, { entry: entryData });

                  if (createRes.status === 201 || createRes.status === 200) {
                    console.log(`  ✓ Created: ${entryData.title}`);
                    synced++;
                  } else {
                    console.log(`  ❌ ${file.fileName}: Creation failed`);
                    failed++;
                  }
                }
              } catch (e) {
                console.log(`  ❌ ${file.fileName}: ${e.message}`);
                failed++;
              }
            }

            console.log(`\n📊 Sync complete:`);
            console.log(`   ✅ Synced: ${synced}`);
            console.log(`   ⏭️  Skipped: ${skipped}`);
            console.log(`   ❌ Failed: ${failed}\n`);

            if (failed > 0) {
              process.exit(1);
            }
          }

          main();
          EOF
          node sync-to-sandbox.js

      - name: Sync summary
        if: success()
        run: |
          echo "✅ GitHub to Sandbox sync completed"
          echo ""
          echo "📝 What happened:"
          echo "  - API Docs changes from main branch synced to Sandbox"
          echo "  - Writers can now review in Sandbox CMS"
          echo "  - After review and publishing, entries will be promoted to Prod"
