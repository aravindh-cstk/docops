name: Cleanup Sandbox (Remove Unpublished Entries)

on:
  workflow_dispatch:
    inputs:
      stack:
        description: 'Stack to cleanup'
        required: true
        default: 'both'
        type: choice
        options:
          - csdocs
          - apidocs
          - both

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Cleanup CS-Docs Sandbox (if selected)
        if: inputs.stack == 'csdocs' || inputs.stack == 'both'
        working-directory: tools/cs-sync
        env:
          PROD_STACK_API_KEY: ${{ secrets.PROD_CSDOCS_STACK_API_KEY }}
          PROD_STACK_MANAGEMENT_TOKEN: ${{ secrets.PROD_CSDOCS_STACK_MANAGEMENT_TOKEN }}
          SANDBOX_STACK_API_KEY: ${{ secrets.CSDOCS_SANDBOX_STACK_API_KEY }}
          SANDBOX_STACK_MANAGEMENT_TOKEN: ${{ secrets.CSDOCS_SANDBOX_MANAGEMENT_TOKEN }}
        run: |
          echo "🧹 Cleaning CS-Docs Sandbox: removing unpublished entries"
          node cleanup-sandbox-unpublished.js --stack csdocs

      - name: Cleanup API Docs Sandbox (if selected)
        if: inputs.stack == 'apidocs' || inputs.stack == 'both'
        working-directory: tools/cs-sync
        env:
          PROD_STACK_API_KEY: ${{ secrets.PROD_APIDOCS_STACK_API_KEY }}
          PROD_STACK_MANAGEMENT_TOKEN: ${{ secrets.PROD_APIDOCS_STACK_MANAGEMENT_TOKEN }}
          SANDBOX_STACK_API_KEY: ${{ secrets.APIDOCS_SANDBOX_STACK_API_KEY }}
          SANDBOX_STACK_MANAGEMENT_TOKEN: ${{ secrets.APIDOCS_SANDBOX_MANAGEMENT_TOKEN }}
        run: |
          echo "🧹 Cleaning API Docs Sandbox: removing unpublished entries"
          node cleanup-sandbox-unpublished.js --stack apidocs

      - name: Summary
        run: |
          echo ""
          echo "✅ Cleanup Complete!"
          echo ""
          echo "Sandbox now contains only entries that exist as published in Production"
