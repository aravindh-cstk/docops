name: Auto-Promote CS Docs (Sandbox→Prod Daily)

on:
  schedule:
    # Run every 15 minutes to promote published Sandbox entries to Prod
    # When writers publish entries in Sandbox (Development/Staging),
    # they automatically sync to Prod CMS within 15 minutes
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auto-promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tools/cs-sync/package-lock.json

      - name: Install dependencies
        working-directory: tools/cs-sync
        run: npm ci

      - name: Auto-promote published Sandbox entries to Prod
        working-directory: tools/cs-sync
        env:
          STACK_TYPE: csdocs
          CSDOCS_SANDBOX_STACK_API_KEY: ${{ secrets.CSDOCS_SANDBOX_STACK_API_KEY }}
          CSDOCS_SANDBOX_MANAGEMENT_TOKEN: ${{ secrets.CSDOCS_SANDBOX_MANAGEMENT_TOKEN }}
          PROD_CSDOCS_STACK_API_KEY: ${{ secrets.PROD_CSDOCS_STACK_API_KEY }}
          PROD_CSDOCS_STACK_MANAGEMENT_TOKEN: ${{ secrets.PROD_CSDOCS_STACK_MANAGEMENT_TOKEN }}
        run: npm run sandbox-promote

      - name: Promotion summary
        if: success()
        run: |
          echo "✅ Auto-promotion check completed (runs every 15 minutes)"
          echo ""
          echo "📝 What happened:"
          echo "  1. ✓ Checked Sandbox for published entries (Development/Staging environments)"
          echo "  2. ✓ Published entries automatically promoted to Prod CMS (staging environment)"
          echo "  3. ✓ Entries are now ready in Prod staging for final promotion to Production"
          echo ""
          echo "⏱️  Promotion happens automatically every 15 minutes when entries are published in Sandbox"
