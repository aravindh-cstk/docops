name: Auto-Promote CS Docs (Sandbox→Prod Daily)

on:
  schedule:
    # Run daily at 2 AM UTC to promote published Sandbox entries to Prod
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  auto-promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tools/cs-sync/package-lock.json

      - name: Install dependencies
        working-directory: tools/cs-sync
        run: npm ci

      - name: Auto-promote published Sandbox entries to Prod
        working-directory: tools/cs-sync
        env:
          STACK_TYPE: csdocs
          CSDOCS_SANDBOX_STACK_API_KEY: ${{ secrets.CSDOCS_SANDBOX_STACK_API_KEY }}
          CSDOCS_SANDBOX_MANAGEMENT_TOKEN: ${{ secrets.CSDOCS_SANDBOX_MANAGEMENT_TOKEN }}
          PROD_CSDOCS_STACK_API_KEY: ${{ secrets.PROD_CSDOCS_STACK_API_KEY }}
          PROD_CSDOCS_STACK_MANAGEMENT_TOKEN: ${{ secrets.PROD_CSDOCS_STACK_MANAGEMENT_TOKEN }}
        run: npm run sandbox-promote

      - name: Promotion summary
        if: success()
        run: |
          echo "✅ Daily auto-promotion completed"
          echo ""
          echo "📝 What happened:"
          echo "  1. ✓ All published entries from Sandbox were promoted to Prod CMS"
          echo "  2. ✓ Entries are published to the 'staging' environment"
          echo "  3. ✓ Production environment is NOT affected (manual step required)"
