name: CS Docs CMS Sync (Prod→GitHub)

# Pulls anything edited directly in the Prod CMS back into the repo as a PR.
#
# This used to run Sandbox→Prod promotion first, in the same job, so that a
# Prod entry promotion had not caught up to yet would not look like a direct
# edit and produce a revert PR. Promotion has since moved to a manual-only
# workflow (sandbox-to-prod-promote-csdocs.yml), because in practice content is
# edited in Prod and a job that re-pushes Sandbox over Prod every five minutes
# can overwrite those edits before anyone sees them.
#
# What makes the pull safe to run on its own is the src-hash-<hash> tag that
# promotion stamps on every entry it writes. An entry whose content still
# matches that fingerprint is a promotion echo and is skipped, so a Prod stack
# that has not been promoted to yet cannot produce a revert PR here.
#
# The concurrency group is shared with the manual promote workflow so this
# never reads Prod while promotion is mid-write.

on:
  schedule:
    # Every 5 minutes (GitHub's documented floor for scheduled workflows, not
    # guaranteed below that). A real-time, webhook-triggered path was
    # evaluated and ruled out: Contentstack webhooks can only send their own
    # fixed payload shape, never GitHub's required {event_type,
    # client_payload} body, so calling GitHub's repository_dispatch API
    # directly from a webhook isn't viable without a middleware layer to
    # reshape the payload. Revisit only alongside building that middleware.
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: sandbox-to-prod-promote-csdocs
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  pull-prod-edits:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tools/cs-sync/package-lock.json

      - name: Install dependencies
        working-directory: tools/cs-sync
        run: npm ci

      # Stages qualifying changes under tools/cs-sync/.prod-sync-staging/ and
      # writes .cms-pull-prod-summary.json grouping them by editor. Deliberately
      # does not write into cs-docs/: the next step applies one editor's bundle at
      # a time onto a clean branch, which is what makes one PR per editor
      # possible instead of one PR per run.
      - name: Detect direct Prod edits
        id: pull
        working-directory: tools/cs-sync
        env:
          STACK_TYPE: csdocs
          PROD_CSDOCS_STACK_API_KEY: ${{ secrets.PROD_CSDOCS_STACK_API_KEY }}
          PROD_CSDOCS_STACK_MANAGEMENT_TOKEN: ${{ secrets.PROD_CSDOCS_STACK_MANAGEMENT_TOKEN }}
          # A name, not a UID. The script resolves it against GET /v3/environments.
          # publish_details records carry the environment UID, so comparing them
          # against the literal name matched nothing, and this step reported "0
          # published entries" on every run for as long as it existed.
          PROD_ENVIRONMENT: production
          # Optional. Echo detection is primarily the src-hash tag on the Prod
          # entry itself; Sandbox read access only sharpens the answer for
          # entries promoted before that tag existed.
          CSDOCS_SANDBOX_STACK_API_KEY: ${{ secrets.CSDOCS_SANDBOX_STACK_API_KEY }}
          CSDOCS_SANDBOX_MANAGEMENT_TOKEN: ${{ secrets.CSDOCS_SANDBOX_MANAGEMENT_TOKEN }}
        run: npm run cms-pull-prod

      # One branch and one PR per editor, each linted with its result posted as a
      # check run. A PR authored with GITHUB_TOKEN does not trigger
      # `pull_request` workflows, so the repo's normal docs-lint job never fires
      # on these branches and the check has to be reported explicitly.
      - name: Open one PR per editor
        if: steps.pull.outcome == 'success'
        working-directory: tools/cs-sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: npm run prod-sync-open-prs

      - name: Run summary
        if: always()
        run: |
          {
            echo "### CS Docs Prod to GitHub sync"
            echo ""
            echo "Detection: \`${{ steps.pull.outcome }}\`"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          SUMMARY_FILE="tools/cs-sync/.cms-pull-prod-summary.json"
          if [ -f "$SUMMARY_FILE" ]; then
            node -e '
              const s = require("./tools/cs-sync/.cms-pull-prod-summary.json");
              const out = [];
              if (!s.bundles.length) out.push("No direct Prod edits found.");
              for (const b of s.bundles) {
                out.push("- **" + b.editorName + "** \u2014 " + b.files.length + " file(s)");
                for (const f of b.files) {
                  const fields = f.fieldsModified.length ? ": " + f.fieldsModified.join(", ") : "";
                  out.push("  - `" + f.filePath + "` (" + f.changeKind + fields + ")");
                }
              }
              out.push("", "Counters: `" + JSON.stringify(s.stats) + "`");
              console.log(out.join("\n"));
            ' >> "$GITHUB_STEP_SUMMARY"
          fi

          {
            echo ""
            echo "Only entries published to Production **and** present in the left navigation are pulled back."
            echo "Content that promotion wrote is skipped via its \`src-hash\` fingerprint."
          } >> "$GITHUB_STEP_SUMMARY"
