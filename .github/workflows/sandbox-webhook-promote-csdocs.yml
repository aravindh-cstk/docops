name: Promote CS Docs entry to Prod (real-time, webhook-triggered)

# Fired by a Contentstack webhook on the Sandbox CS Docs stack (Entry > Publish,
# scoped to docs_article) calling GitHub's repository_dispatch API directly —
# see tools/cs-sync/CONTENTSTACK_WEBHOOK_CONFIG.md for the webhook setup this
# expects. This lets a single published entry reach Prod within seconds instead
# of waiting for the next sandbox-auto-promote-csdocs.yml cron tick.
#
# That cron stays completely unchanged and is the safety net for this path:
# Contentstack's webhook retries aren't unlimited, and GitHub's concurrency
# lock below can drop some runs during a publish burst (e.g. a Release). Any
# entry this workflow misses still gets picked up by the next cron tick.

run-name: "Promote ${{ github.event.client_payload.uid || 'INVALID' }} (webhook)"

on:
  repository_dispatch:
    types: [csdocs-sandbox-entry-published]

# Shared with sandbox-auto-promote-csdocs.yml and sandbox-to-prod-promote-csdocs.yml.
# The promote script's create-or-update check against Prod is not atomic, so a
# webhook run and a cron run must never execute concurrently against the same
# entry — this lock is what prevents that, not an optional detail.
concurrency:
  group: sandbox-to-prod-promote-csdocs
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote-one:
    runs-on: ubuntu-latest
    steps:
      - name: Validate webhook payload
        run: |
          UID="${{ github.event.client_payload.uid }}"
          if [ -z "$UID" ]; then
            echo "::error::client_payload.uid is missing/empty — refusing to fall through to 'promote everything'. Check the Contentstack webhook body/variable bindings."
            exit 1
          fi

          # Optional defense-in-depth: if the webhook happens to pass
          # content_type_uid, reject anything that isn't docs_article rather
          # than silently promoting into the wrong pipeline.
          CT="${{ github.event.client_payload.content_type_uid }}"
          if [ -n "$CT" ] && [ "$CT" != "docs_article" ]; then
            echo "::error::content_type_uid '$CT' is not docs_article — wrong webhook wired to this workflow?"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tools/cs-sync/package-lock.json

      - name: Install dependencies
        working-directory: tools/cs-sync
        run: npm ci

      - name: Promote this entry from Sandbox to Prod
        working-directory: tools/cs-sync
        env:
          STACK_TYPE: csdocs
          ENTRY_UIDS: ${{ github.event.client_payload.uid }}
          CSDOCS_SANDBOX_STACK_API_KEY: ${{ secrets.CSDOCS_SANDBOX_STACK_API_KEY }}
          CSDOCS_SANDBOX_MANAGEMENT_TOKEN: ${{ secrets.CSDOCS_SANDBOX_MANAGEMENT_TOKEN }}
          PROD_CSDOCS_STACK_API_KEY: ${{ secrets.PROD_CSDOCS_STACK_API_KEY }}
          PROD_CSDOCS_STACK_MANAGEMENT_TOKEN: ${{ secrets.PROD_CSDOCS_STACK_MANAGEMENT_TOKEN }}
        run: npm run sandbox-promote
