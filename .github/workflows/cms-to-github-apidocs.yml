name: Sync API Docs CMS changes to GitHub

on:
  schedule:
    # Runs every 15 minutes. Looks back 20 minutes to cover any timing gap.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      lookback_minutes:
        description: "How many minutes back to check for CMS changes"
        default: "20"
        required: false

concurrency:
  group: cms-to-github-apidocs
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  cms-pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tools/cs-sync/package-lock.json

      - name: Install dependencies
        working-directory: tools/cs-sync
        run: npm ci

      - name: Pull changes from CMS (API Docs)
        working-directory: tools/cs-sync
        env:
          CONTENTSTACK_API_KEY: ${{ secrets.APIDOCS_SANDBOX_STACK_API_KEY }}
          CONTENTSTACK_MANAGEMENT_TOKEN: ${{ secrets.APIDOCS_SANDBOX_MANAGEMENT_TOKEN }}
          CONTENTSTACK_ENVIRONMENT: sandbox
          CS_REGION: us
          CS_CONTENT_TYPE: api_detail_page
        run: npm run cms-pull -- --lookback ${{ inputs.lookback_minutes || '20' }}

      - name: Check for changes
        id: changes
        run: |
          if git status --porcelain api-docs/ | grep -q .; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changed files:"
            git status --porcelain api-docs/
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No API doc files changed — nothing to PR."
          fi

      - name: Create branch, commit, and push
        id: commit
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          BRANCH="cms-sync/apidocs/$(date -u +%Y%m%d-%H%M%S)"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add api-docs/
          git commit -m "chore: sync API doc changes from Contentstack CMS (Sandbox)"
          # Push before reporting a check run — the Checks API requires the SHA
          # to already exist on GitHub's servers, not just locally on the runner.
          git push origin "$BRANCH"

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # Run lint checks before creating PR
      - name: Lint changed docs
        id: lint
        if: steps.changes.outputs.has_changes == 'true'
        working-directory: tools/cs-sync
        run: |
          if npm run lint -- --base origin/main > /tmp/lint-output.txt 2>&1; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi
          cat /tmp/lint-output.txt

      - name: Report lint check
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CONCLUSION="success"
          if [ "${{ steps.lint.outputs.passed }}" != "true" ]; then
            CONCLUSION="failure"
          fi

          jq -n \
            --arg sha "${{ steps.commit.outputs.sha }}" \
            --arg conclusion "$CONCLUSION" \
            --arg summary "$(head -c 60000 /tmp/lint-output.txt)" \
            '{name: "lint", head_sha: $sha, status: "completed", conclusion: $conclusion,
              output: {title: "API Docs lint", summary: $summary}}' \
            > /tmp/check-run.json

          gh api "repos/${{ github.repository }}/check-runs" --input /tmp/check-run.json > /dev/null

      - name: Open PR with CMS changes
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.commit.outputs.branch }}"

          # Build the PR body with per-file editor info from the summary JSON
          SUMMARY_FILE="tools/cs-sync/.cms-pull-summary.json"

          if [ -f "$SUMMARY_FILE" ]; then
            CHANGES_TABLE=$(node -e "
              const changes = require('./$SUMMARY_FILE');
              const rows = changes.map(c =>
                '| \`' + c.filePath + '\` | ' + c.url + ' | **' + c.updatedByName + '** | ' + new Date(c.updatedAt).toUTCString() + ' |'
              );
              console.log('| File | CMS Entry | Modified By | Modified At |');
              console.log('|------|-----------|-------------|-------------|');
              rows.forEach(r => console.log(r));
            ")
          else
            CHANGED_FILES=$(git diff origin/main..."$BRANCH" --name-only | grep '^api-docs/' | head -20)
            CHANGES_TABLE="| File | CMS Entry | Modified By | Modified At |
          |------|-----------|-------------|-------------|
          $(echo "$CHANGED_FILES" | sed 's/^/| \`/' | sed 's/$/ \` | — | — | — |/')"
          fi

          gh pr create \
            --title "CMS → GitHub: API doc changes detected (Sandbox)" \
            --body "## CMS → GitHub sync (Sandbox → Git)

          This PR was automatically created because one or more API documentation entries were edited in the **Sandbox CMS** and differ from the current files in \`api-docs/\`.

          **Review the diff carefully before merging** — in particular check that no content was unintentionally overwritten.

          ### Changes detected
          ${CHANGES_TABLE}

          ### Workflow
          - These changes originated from the **Sandbox stack** (writers' testing environment)
          - Merging to main will trigger sync to Sandbox (maintaining git ↔ sandbox parity)
          - When entries are published in Sandbox, they will be auto-promoted to Prod/Staging

          ---
          _Triggered by the \`cms-to-github-apidocs\` workflow · $(date -u '+%Y-%m-%d %H:%M UTC')_" \
            --base main \
            --head "$BRANCH"
