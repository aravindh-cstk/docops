name: Sync CS Docs CMS changes to GitHub

on:
  schedule:
    # Runs every 15 minutes. Looks back 20 minutes to cover any timing gap.
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      lookback_minutes:
        description: "How many minutes back to check for CMS changes"
        default: "20"
        required: false

concurrency:
  group: cms-to-github-csdocs
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  checks: write

jobs:
  cms-pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tools/cs-sync/package-lock.json

      - name: Install dependencies
        working-directory: tools/cs-sync
        run: npm ci

      - name: Pull changes from CMS (CS Docs)
        working-directory: tools/cs-sync
        env:
          STACK_TYPE: csdocs
          CSDOCS_SANDBOX_STACK_API_KEY: ${{ secrets.CSDOCS_SANDBOX_STACK_API_KEY }}
          CSDOCS_SANDBOX_MANAGEMENT_TOKEN: ${{ secrets.CSDOCS_SANDBOX_MANAGEMENT_TOKEN }}
          LOOKBACK_MINUTES: ${{ inputs.lookback_minutes || '20' }}
        run: npm run cms-pull-sandbox

      - name: Check for changes
        id: changes
        run: |
          if git status --porcelain cs-docs/ | grep -q .; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Changed files:"
            git status --porcelain cs-docs/
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No CS doc files changed — nothing to PR."
          fi

      - name: Create branch, commit, and push
        id: commit
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          # Fixed name, reused every run, rather than a fresh timestamped branch.
          # Edits landing in separate runs before the first PR merges force-push
          # onto this same branch, updating the one open PR instead of opening a
          # competing one (see the "check for open PR" step below).
          BRANCH="cms-sync/csdocs"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Reset from current main every run, not from whatever this branch
          # last pointed at, so each run's commit is a clean, current diff.
          git checkout -B "$BRANCH" origin/main
          git add cs-docs/
          git commit -m "chore: sync CS doc changes from Contentstack CMS (Sandbox)"
          # Push before reporting a check run — the Checks API requires the SHA
          # to already exist on GitHub's servers, not just locally on the runner.
          # Force push since the branch was just reset from main above.
          git push origin "$BRANCH" --force

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check for an already open PR on this branch
        id: existing_pr
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.commit.outputs.branch }}"
          NUMBER=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$NUMBER" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "number=$NUMBER" >> "$GITHUB_OUTPUT"
            echo "PR #$NUMBER is already open on $BRANCH — the force-push above already updated it."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No open PR on $BRANCH yet."
          fi

      # Run lint checks before creating PR
      - name: Lint changed docs
        id: lint
        if: steps.changes.outputs.has_changes == 'true'
        working-directory: tools/cs-sync
        run: |
          if npm run lint -- --base origin/main > /tmp/lint-output.txt 2>&1; then
            echo "passed=true" >> "$GITHUB_OUTPUT"
          else
            echo "passed=false" >> "$GITHUB_OUTPUT"
          fi
          cat /tmp/lint-output.txt

      - name: Report lint check
        if: steps.changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          CONCLUSION="success"
          if [ "${{ steps.lint.outputs.passed }}" != "true" ]; then
            CONCLUSION="failure"
          fi

          jq -n \
            --arg sha "${{ steps.commit.outputs.sha }}" \
            --arg conclusion "$CONCLUSION" \
            --arg summary "$(head -c 60000 /tmp/lint-output.txt)" \
            '{name: "lint", head_sha: $sha, status: "completed", conclusion: $conclusion,
              output: {title: "CS Docs lint", summary: $summary}}' \
            > /tmp/check-run.json

          gh api "repos/${{ github.repository }}/check-runs" --input /tmp/check-run.json > /dev/null

      - name: Open PR with CMS changes
        if: steps.changes.outputs.has_changes == 'true' && steps.existing_pr.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="${{ steps.commit.outputs.branch }}"

          # Build the PR body with per-file editor info from the summary JSON
          SUMMARY_FILE="tools/cs-sync/.cms-pull-summary.json"

          if [ -f "$SUMMARY_FILE" ]; then
            CHANGES_TABLE=$(node -e "
              const changes = require('./$SUMMARY_FILE');
              const rows = changes.map(c =>
                '| \`' + c.filePath + '\` | ' + c.url + ' | **' + c.updatedByName + '** | ' + new Date(c.updatedAt).toUTCString() + ' |'
              );
              console.log('| File | CMS Entry | Modified By | Modified At |');
              console.log('|------|-----------|-------------|-------------|');
              rows.forEach(r => console.log(r));
            ")
          else
            CHANGED_FILES=$(git diff origin/main..."$BRANCH" --name-only | grep '^cs-docs/' | head -20)
            CHANGES_TABLE="| File | CMS Entry | Modified By | Modified At |
          |------|-----------|-------------|-------------|
          $(echo "$CHANGED_FILES" | sed 's/^/| \`/' | sed 's/$/ \` | — | — | — |/')"
          fi

          gh pr create \
            --title "CMS → GitHub: CS doc changes detected (Sandbox)" \
            --body "## CMS → GitHub sync (Sandbox → Git)

          This PR was automatically created because one or more CS documentation entries were edited in the **Sandbox CMS** and differ from the current files in \`cs-docs/\`.

          **Review the diff carefully before merging** — in particular check that no content was unintentionally overwritten.

          ### Changes detected
          ${CHANGES_TABLE}

          ### Workflow
          - These changes originated from the **Sandbox stack** (writers' testing environment)
          - Merging to main will trigger sync to Sandbox (maintaining git ↔ sandbox parity)
          - When entries are published in Sandbox, they will be auto-promoted to Prod/Staging

          ---
          _Triggered by the \`cms-to-github-csdocs\` workflow · $(date -u '+%Y-%m-%d %H:%M UTC')_" \
            --base main \
            --head "$BRANCH"
